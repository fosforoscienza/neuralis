<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralis</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;cursor:none}
  canvas{display:block}
</style>
<!-- p5.js servito in locale: l'installazione deve funzionare anche offline. -->
<script src="libs/p5.min.js"></script>
</head>
<body>
<script>
"use strict";
// ---- frame artistico in formato TV (16:9): le linee riempiono il rettangolo ---
// Tutta l'opera vive in questo buffer e viene poi mostrata a pieno schermo sulla
// TV; l'export di stampa e' lo stesso buffer (1920x1080 ~ 325 DPI su 15 cm).
const ART_W = 1920, ART_H = 1080;
// Soglie cromatiche (HSB, gradi): caldo -> rosso vivo, freddo -> ciano.
const HUE_WARM = 2, HUE_COLD = 210;

let artBuf, ws;
let warmth = 0.5, activation = 0.4, frozen = false;
let hasSignature = false, seed = null;

// Parametri del campo di flusso, derivati dalla firma (unici per persona).
let particles = [], fieldScale = 0.0012, turnsBase = 1.6, paletteOff = 0, NP = 1000;
let zoff = 0;
let powers = { delta: 0.1, theta: 0.2, alpha: 0.35, beta: 0.3, gamma: 0.05 };
let animMode = 'flowfield';
let kShapes = [];   // composizione Kandinsky (figure geometriche)

// PRNG deterministico: stessa firma -> stesso campo di base, per persona.
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function applySignature(s){
  seed = s >>> 0;
  const rng = mulberry32(seed);
  noiseSeed(seed);                       // forma del campo unica per persona
  fieldScale = 0.0008 + rng() * 0.0016;  // scala del rumore (struttura)
  turnsBase  = 1.0 + rng() * 1.6;        // "giri" del campo
  paletteOff = rng() * 44 - 22;          // sfumatura cromatica personale
  NP         = 900 + Math.floor(rng() * 600); // densita' di linee
  hasSignature = true;
  initForMode();
}

function maxFlowType(){
  const a = powers.alpha, b = powers.beta, t = powers.theta;
  const r = Math.random() * (a + b + t + 0.001);
  if(r < a) return 'alpha';
  if(r < a + b) return 'beta';
  return 'theta';
}
function newParticle(){
  const p = { x: Math.random() * ART_W, y: Math.random() * ART_H,
              life: 0, max: 0, hueJ: Math.random() * 2 - 1 };
  if(animMode === 'maxflow') p.type = maxFlowType();
  return p;
}
function initParticles(){
  particles = [];
  for(let i = 0; i < NP; i++) particles.push(newParticle());
  clearArt();
}

// Inizializza la struttura adeguata al modo attivo.
function initForMode(){
  if(animMode === 'kandinsky') initKandinsky();
  else if(animMode === 'cymatics') initCymatics();
  else if(animMode === 'neural') initNeural();
  else if(animMode === 'voronoi') initVoronoi();
  else if(animMode === 'mandala') initMandala();
  else initParticles();
}

// Colore di fondo dinamico: stessa famiglia cromatica delle linee (tonalita'
// dal mood = warmth), tono scuro che "respira" con l'evoluzione del campo
// (zoff) e con l'attivazione -> quando le linee si muovono, anche lo sfondo
// cambia un po'.
// Tonalita' di base dal mood (warmth): caldo -> rosso vivo, freddo -> ciano.
// La curva (pow 0.7) sposta un po' la gamma verso il caldo, cosi' il rosso si
// vede gia' negli stati ben caldi e non solo al picco assoluto.
function moodHue(){
  const wc = Math.pow(warmth, 0.7);
  return HUE_WARM + (1 - wc) * (HUE_COLD - HUE_WARM);
}

function bgColor(){
  const hue = (moodHue() + 6 * Math.sin(zoff * 0.7) + 360) % 360;
  const sat = 50 + activation * 25;
  const br  = 9 + 2.5 * Math.sin(zoff * 1.3) + activation * 3;
  return [hue, sat, Math.max(4, br)];
}

function clearArt(){
  const bg = bgColor();
  artBuf.push();
  artBuf.noStroke();
  artBuf.fill(bg[0], bg[1], bg[2], 100);
  artBuf.rect(0, 0, ART_W, ART_H);
  artBuf.pop();
}

function setup(){
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  artBuf = createGraphics(ART_W, ART_H);
  artBuf.colorMode(HSB, 360, 100, 100, 100);
  artBuf.pixelDensity(1);                // buffer esattamente 1920x1080 px
  clearArt();
  noCursor();
  connectWS();
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); }

function draw(){
  const bg = bgColor();
  background(bg[0], bg[1], bg[2]);
  if(!hasSignature){ drawWaiting(); return; }
  if(!frozen){
    if(animMode === 'kandinsky') stepKandinsky(artBuf, bg);
    else if(animMode === 'cymatics') stepCymatics(artBuf, bg);
    else if(animMode === 'neural') stepNeural(artBuf, bg);
    else if(animMode === 'voronoi') stepVoronoi(artBuf, bg);
    else if(animMode === 'mandala') stepMandala(artBuf, bg);
    else if(animMode === 'maxflow') stepMaxFlow(artBuf, bg);
    else stepFlowField(artBuf, bg);
  }
  // blit "contain": il frame 16:9 riempie la TV 16:9 (su monitor diversi, bordi).
  const s = Math.min(width / ART_W, height / ART_H);
  const w = ART_W * s, h = ART_H * s;
  image(artBuf, (width - w) / 2, (height - h) / 2, w, h);
}

// ---- flow field: passo generativo base ----------------------------------------
function stepFlowField(g, bg){
  // Persistenza: velo del colore di fondo (dinamico) invece di azzerare ->
  // l'opera si accumula e il fondo segue lentamente il mood.
  g.noStroke();
  g.fill(bg[0], bg[1], bg[2], 3.0);
  g.rect(0, 0, ART_W, ART_H);

  const act = activation;
  const hue     = moodHue();                        // caldo->rosso vivo, freddo->ciano
  const turns   = turnsBase * lerp(0.7, 2.6, act);  // attivo -> campo turbolento
  const lifeMax = lerp(140, 16, act);               // attivo -> linee corte
  const spd     = lerp(1.3, 3.2, act);              // attivo -> piu' veloce
  const sat     = lerp(76, 96, act);                // saturazione alta -> colori vivi
  const sw      = lerp(2.4, 1.2, act);

  for(const p of particles){
    if(p.max === 0) p.max = lifeMax * (0.6 + Math.random() * 0.8);
    const ang = noise(p.x * fieldScale, p.y * fieldScale, zoff) * TWO_PI * turns;
    const nx = p.x + Math.cos(ang) * spd;
    const ny = p.y + Math.sin(ang) * spd;
    const hh = (((hue + paletteOff + p.hueJ * 16) % 360) + 360) % 360;
    g.strokeWeight(sw * 2.6); g.stroke(hh, sat, 72, 9);   g.line(p.x, p.y, nx, ny); // bagliore
    g.strokeWeight(sw);       g.stroke(hh, sat, 100, 52); g.line(p.x, p.y, nx, ny); // nucleo
    p.x = nx; p.y = ny; p.life++;
    if(p.life > p.max || p.x < 0 || p.x > ART_W || p.y < 0 || p.y > ART_H){
      p.x = Math.random() * ART_W; p.y = Math.random() * ART_H;
      p.life = 0; p.max = 0; p.hueJ = Math.random() * 2 - 1;
    }
  }
  zoff += lerp(0.0008, 0.004, act);       // evoluzione lenta/rapida del campo
}

// ---- max flow: linee a lunghezza variabile per banda EEG -------------------
// alpha (8-13 Hz) -> tratti lunghi e distesi   (tipo 'alpha')
// beta  (13-30Hz) -> dash corti ed energetici  (tipo 'beta')
// theta (4-8 Hz)  -> tratti medi ondulati      (tipo 'theta')
// 3 famiglie cromatiche simultanee: base | base+150° | base-60°
function stepMaxFlow(g, bg){
  g.noStroke();
  g.fill(bg[0], bg[1], bg[2], 4.0);
  g.rect(0, 0, ART_W, ART_H);

  const act = activation;
  const baseHue = moodHue();
  const turns = turnsBase * lerp(0.6, 3.8, act) + powers.theta * 2.5;

  for(const p of particles){
    if(!p.type) p.type = maxFlowType();
    const ang = noise(p.x * fieldScale, p.y * fieldScale, zoff) * TWO_PI * turns;

    let spd, lifeMax, sat, br, sw, coreA, glowA, hue;

    switch(p.type){
      case 'alpha':
        spd     = lerp(1.2, 2.6, act);
        lifeMax = lerp(200, 60, act);
        sat = 88; br = 92; sw = 2.4; coreA = 48; glowA = 9;
        hue = ((baseHue + paletteOff + p.hueJ * 22) % 360 + 360) % 360;
        break;
      case 'beta':
        spd     = lerp(4.0, 7.0, act);
        lifeMax = lerp(20, 8, act);
        sat = 100; br = 100; sw = 1.2; coreA = 85; glowA = 14;
        hue = ((baseHue + 150 + paletteOff + p.hueJ * 30) % 360 + 360) % 360;
        break;
      default: // theta
        spd     = lerp(1.8, 3.6, act);
        lifeMax = lerp(80, 25, act);
        sat = 94; br = 96; sw = 1.7; coreA = 62; glowA = 11;
        hue = ((baseHue - 60 + paletteOff + p.hueJ * 28) % 360 + 720) % 360;
        break;
    }

    if(p.max === 0) p.max = lifeMax * (0.5 + Math.random());

    const nx = p.x + Math.cos(ang) * spd;
    const ny = p.y + Math.sin(ang) * spd;

    g.strokeWeight(sw * 3.8); g.stroke(hue, sat - 14, br, glowA); g.line(p.x, p.y, nx, ny);
    g.strokeWeight(sw);       g.stroke(hue, sat, br, coreA);       g.line(p.x, p.y, nx, ny);

    p.x = nx; p.y = ny; p.life++;

    if(p.life > p.max || p.x < 0 || p.x > ART_W || p.y < 0 || p.y > ART_H){
      p.x = Math.random() * ART_W; p.y = Math.random() * ART_H;
      p.life = 0; p.max = 0;
      p.hueJ = Math.random() * 2 - 1;
      p.type = maxFlowType();
    }
  }

  zoff += lerp(0.001, 0.008, act);
}

// ---- kandinsky: quadro geometrico dinamico --------------------------------
// Omaggio a "Composition VIII" (Bauhaus, 1923): cerchi, triangoli, linee,
// archi e quadrati su fondo chiaro. Corrispondenza forma->colore di Kandinsky
// (cerchio=blu, triangolo=giallo, quadrato=rosso); le BANDE EEG decidono QUALI
// figure dominano, WARMTH gonfia le forme calde/fredde, ACTIVATION alza
// saturazione/rotazione/densita'. Composizione seedata dalla firma (unica).
const FAM = {
  blue:    [[214,86,92],[224,80,88],[208,90,85]],
  cyan:    [[190,85,92],[182,82,90]],
  yellow:  [[52,92,100],[46,95,100],[40,96,98]],
  red:     [[4,88,96],[2,92,92],[356,85,95]],
  orange:  [[28,95,99],[34,96,98]],
  green:   [[142,70,86],[160,66,82]],
  violet:  [[278,68,90],[266,70,86]],
  magenta: [[326,80,95],[338,78,94]],
  black:   [[0,0,9]],
};
function pickFam(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }

// Tipo di figura pesato dalle bande correnti (istantanea alla creazione):
// alpha->cerchi, beta->triangoli/linee, theta->archi, delta->quadrati, gamma->punti.
function pickKType(rng){
  const a = powers.alpha, b = powers.beta, t = powers.theta, d = powers.delta, g = powers.gamma;
  const w = [
    ["circle", 0.7  + a * 2.4],
    ["tri",    0.4  + b * 2.0],
    ["line",   0.35 + b * 1.5 + activation * 0.6],
    ["arc",    0.3  + t * 2.2],
    ["square", 0.45 + d * 1.8],
    ["dot",    0.55 + g * 2.6],
  ];
  let tot = 0; for(const e of w) tot += e[1];
  let r = rng() * tot;
  for(const e of w){ if(r < e[1]) return e[0]; r -= e[1]; }
  return "circle";
}

// Configura/riconfigura una figura. Riusata sia alla creazione (rng seedato)
// sia alla RINASCITA (rng = Math.random, tipo dalle bande correnti) -> ricambio.
function configureKShape(rng, s, type){
  s.type = type;
  s.x = rng() * ART_W; s.y = rng() * ART_H;
  s.rot = rng() * TWO_PI;
  s.rotSpd = (rng() * 2 - 1) * 1.6;             // rotazione più decisa
  s.phase = rng() * TWO_PI; s.dphase = rng() * TWO_PI;
  const dir = rng() * TWO_PI, sp = 0.6 + rng() * 1.8;
  s.vx = Math.cos(dir) * sp; s.vy = Math.sin(dir) * sp; // traslazione (scalata da activation)
  s.pulseAmp = 0.08 + rng() * 0.26;             // respiro di scala
  s.pulseSpd = 0.6 + rng() * 1.8;
  s.life = 0;                                   // ciclo di vita -> comparsa/scomparsa
  s.fadeIn = 8 + Math.floor(rng() * 14);
  const base = lerp(210, 70, activation);       // più attivo -> ricambio più rapido
  s.max = Math.floor(base * (0.55 + rng() * 0.9));
  let pal;
  if(type === "circle"){ pal = rng() < 0.8 ? FAM.blue : FAM.cyan; s.r = 38 + rng() * 190; s.rings = 1 + Math.floor(rng() * 4); }
  else if(type === "tri"){ pal = FAM.yellow; s.r = 28 + rng() * 120; }
  else if(type === "square"){ pal = rng() < 0.85 ? FAM.red : FAM.orange; s.r = 26 + rng() * 120; s.checker = rng() < 0.3; }
  else if(type === "line"){ pal = rng() < 0.6 ? FAM.black : (rng() < 0.5 ? FAM.violet : FAM.blue);
                            s.len = 130 + rng() * 430; s.thick = 4 + rng() * 12; s.node = rng() < 0.5;
                            s.nodeCol = pickFam(rng, [].concat(FAM.red, FAM.yellow, FAM.blue)); }
  else if(type === "arc"){ pal = [FAM.green, FAM.cyan, FAM.orange][Math.floor(rng() * 3)];
                           s.r = 50 + rng() * 170; s.thick = 4 + rng() * 10; s.sweep = (0.6 + rng() * 1.6) * PI; }
  else { pal = [FAM.magenta, FAM.orange, FAM.violet, FAM.yellow][Math.floor(rng() * 4)]; s.r = 5 + rng() * 22; }
  s.col = pickFam(rng, pal);
  s.neutral = s.col[1] <= 5;                                   // nero = accento neutro
  s.warmFam = !s.neutral && (s.col[0] < 70 || s.col[0] > 300); // gialli/arancio/rossi/magenta
  s.sortR = type === "line" ? s.len * 0.5 : (type === "dot" ? s.r * 0.4 : s.r);
  return s;
}
function makeKShape(rng, type){ return configureKShape(rng, {}, type); }

function initKandinsky(){
  const rng = mulberry32((seed >>> 0) || 1);                   // stessa firma -> stessa tela
  const base = 240 + Math.floor(rng() * 120);                  // 240..360 figure
  const count = Math.min(560, base + Math.floor(activation * 140)); // quantita' alta
  kShapes = [];
  for(let i = 0; i < count; i++){
    const s = makeKShape(rng, pickKType(rng));
    s.life = Math.floor(rng() * s.max);                        // sfasa i cicli di vita (niente blink globale)
    kShapes.push(s);
  }
  kShapes.sort((p, q) => q.sortR - p.sortR);                   // grandi dietro, accenti davanti
  clearArt();
}

function drawKShape(g, s, tt, act, env){
  // Le forme della temperatura dominante "respirano" col mood (warmth).
  // env (0..1) = dissolvenza del ciclo di vita -> modula l'opacità.
  const emph = s.neutral ? 0.82 : (s.warmFam ? warmth : 1 - warmth);
  const A = (66 + 30 * emph) * env;
  const h = s.col[0];
  const sat = Math.min(100, s.col[1] * (0.82 + 0.25 * act));   // activation -> piu' vivido
  const br = s.col[2];

  if(s.type === "circle"){                                     // alpha -> respiro
    const breath = 1 + 0.12 * Math.sin(tt * 1.2 + s.phase) * Math.min(1, powers.alpha * 3);
    const R = s.r * breath;
    for(let k = 0; k < s.rings; k++){
      const rr = R * (1 - k / s.rings);
      if(k % 2 === 0){ g.noStroke(); g.fill(h, sat, br, A * (0.55 + 0.45 * (1 - k / s.rings))); g.ellipse(0, 0, rr * 2, rr * 2); }
      else { g.noFill(); g.stroke(0, 0, 12, 60 * env); g.strokeWeight(2.2); g.ellipse(0, 0, rr * 2, rr * 2); }
    }
  } else if(s.type === "tri"){
    const r = s.r;
    g.noStroke(); g.fill(h, sat, br, A);
    g.triangle(0, -r, r * 0.866, r * 0.5, -r * 0.866, r * 0.5);
    g.noFill(); g.stroke(0, 0, 12, 45 * env); g.strokeWeight(1.6);
    g.triangle(0, -r, r * 0.866, r * 0.5, -r * 0.866, r * 0.5);
  } else if(s.type === "square"){
    g.rectMode(CENTER);
    if(s.checker){                                             // scacchiera 2x2
      const q = s.r / 2;
      for(let ix = 0; ix < 2; ix++) for(let iy = 0; iy < 2; iy++){
        const on = (ix + iy) % 2 === 0;
        g.noStroke(); g.fill(h, sat, on ? br : br * 0.5, A);
        g.rect(-q / 2 + ix * q, -q / 2 + iy * q, q, q);
      }
    } else {
      g.noStroke(); g.fill(h, sat, br, A); g.rect(0, 0, s.r, s.r);
      g.noFill(); g.stroke(0, 0, 12, 40 * env); g.strokeWeight(1.6); g.rect(0, 0, s.r, s.r);
    }
  } else if(s.type === "line"){                                // movimento/tensione
    g.rectMode(CENTER); g.noStroke(); g.fill(h, sat, br, Math.min(100, A + 8));
    g.rect(0, 0, s.len, s.thick, s.thick * 0.5);
    if(s.node){ g.fill(s.nodeCol[0], s.nodeCol[1], s.nodeCol[2], 95 * env); g.ellipse(s.len / 2, 0, s.thick * 2.6, s.thick * 2.6); }
  } else if(s.type === "arc"){                                 // theta -> oscilla
    const sway = s.sweep * (0.85 + 0.15 * Math.sin(tt + s.phase) * (0.5 + Math.min(1, powers.theta * 3)));
    g.noFill(); g.stroke(h, sat, br, A); g.strokeWeight(s.thick);
    g.arc(0, 0, s.r * 2, s.r * 2, 0, sway);
  } else {                                                     // dot: gamma -> scintilla
    const tw = 1 + 0.5 * Math.sin(tt * 3 + s.phase) * Math.min(1, powers.gamma * 5);
    g.noStroke(); g.fill(h, sat, br, A); g.ellipse(0, 0, s.r * 2 * tw, s.r * 2 * tw);
  }
}

function stepKandinsky(g, bg){
  if(!kShapes.length) initKandinsky();
  // Fondo chiaro "da tela", lievemente tinto dal mood (caldo/freddo).
  const lh = (moodHue() + 360) % 360;
  g.push();
  g.noStroke();
  g.fill(lh, 6 + (1 - warmth) * 8, 90);
  g.rect(0, 0, ART_W, ART_H);

  const act = activation;
  const tt = zoff;
  const travel = 0.5 + act * 2.6;                              // velocità di spostamento (activation)
  for(const s of kShapes){
    // ciclo di vita: invecchia e, a fine vita, RINASCE altrove con nuova identità
    // (tipo/colore/dimensione dalle bande correnti) -> figure che vanno e vengono.
    s.life++;
    if(s.life >= s.max) configureKShape(Math.random, s, pickKType(Math.random));
    // dissolvenza in entrata/uscita -> comparsa e scomparsa morbide
    const fin = Math.min(1, s.life / s.fadeIn);
    const fout = Math.min(1, (s.max - s.life) / Math.max(1, s.max * 0.28));
    const env = Math.max(0, Math.min(fin, fout));
    // traslazione vera e propria + wrap ai bordi
    s.x += s.vx * travel; s.y += s.vy * travel;
    if(s.x < -80) s.x = ART_W + 80; else if(s.x > ART_W + 80) s.x = -80;
    if(s.y < -80) s.y = ART_H + 80; else if(s.y > ART_H + 80) s.y = -80;
    const x = s.x + Math.sin(tt * 0.8 + s.dphase) * 12 * (0.4 + act);
    const y = s.y + Math.cos(tt * 0.7 + s.dphase * 1.3) * 12 * (0.4 + act);
    let rot = s.rot + tt * s.rotSpd * (0.25 + act * 1.4);
    if(s.type === "tri") rot += Math.sin(tt * 9 + s.phase) * 0.12 * Math.min(1, powers.beta * 3); // beta -> vibra
    const sc = 1 + s.pulseAmp * Math.sin(tt * s.pulseSpd + s.phase);  // respiro di scala
    g.push();
    g.translate(x, y);
    g.rotate(rot);
    g.scale(sc);
    drawKShape(g, s, tt, act, env);
    g.pop();
  }
  g.pop();
  zoff += lerp(0.01, 0.04, act);                               // tempo più rapido
}

// ---- cimatica: figure di Chladni dalle frequenze EEG ----------------------
// Il campo S(u,v,t) somma, per banda, i modi di una piastra quadrata vibrante
// (formula di Chladni); ampiezza = potenza della banda LIVE, numeri d'onda e
// fasi dalla firma. |S|~0 = linea nodale ("sabbia"); antinodi = colore (segno
// di S -> tinta calda/fredda). Calcolato su griglia ridotta e upscalato.
const CYM_W = 320, CYM_H = 180;
let cymBuf = null, cymModes = [];

// HSB(0-360,0-100,0-100) -> RGB(0-255) per scrittura diretta nei pixel.
function hsb2rgb(h, s, b){
  h = ((h % 360) + 360) % 360; s /= 100; b /= 100;
  const c = b * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = b - c;
  let r, g, l;
  if(h < 60){ r = c; g = x; l = 0; }
  else if(h < 120){ r = x; g = c; l = 0; }
  else if(h < 180){ r = 0; g = c; l = x; }
  else if(h < 240){ r = 0; g = x; l = c; }
  else if(h < 300){ r = x; g = 0; l = c; }
  else { r = c; g = 0; l = x; }
  return [(r + m) * 255, (g + m) * 255, (l + m) * 255];
}

function initCymatics(){
  if(!cymBuf){ cymBuf = createGraphics(CYM_W, CYM_H); cymBuf.pixelDensity(1); }
  const rng = mulberry32((seed >>> 0) || 1);          // numeri d'onda/fasi dalla firma
  const baseN = [1, 2, 3, 5, 8], baseM = [2, 3, 4, 7, 11]; // delta..gamma, crescenti
  cymModes = [];
  for(let b = 0; b < 5; b++){
    const n = Math.max(1, baseN[b] + (Math.floor(rng() * 3) - 1)); // +/-1
    const m = Math.max(1, baseM[b] + (Math.floor(rng() * 3) - 1));
    cymModes.push({ n, m, phi: rng() * TWO_PI, w: 0.12 + rng() * 0.5 });
  }
}

function stepCymatics(g, bg){
  if(!cymBuf || !cymModes.length) initCymatics();
  const t = zoff, act = activation;
  const A = [powers.delta, powers.theta, powers.alpha, powers.beta, powers.gamma];
  const tph = cymModes.map(md => Math.cos(md.phi + t * md.w));   // evoluzione temporale
  // Separabilita': precalcolo i coseni per colonne/righe -> per-cella solo prodotti.
  const cuN = [], cuM = [], rvN = [], rvM = [];
  for(let b = 0; b < 5; b++){
    const n = cymModes[b].n, m = cymModes[b].m;
    const an = new Float32Array(CYM_W), am = new Float32Array(CYM_W);
    for(let i = 0; i < CYM_W; i++){ const u = i / (CYM_W - 1); an[i] = Math.cos(n * Math.PI * u); am[i] = Math.cos(m * Math.PI * u); }
    const bn = new Float32Array(CYM_H), bm = new Float32Array(CYM_H);
    for(let j = 0; j < CYM_H; j++){ const v = j / (CYM_H - 1); bn[j] = Math.cos(n * Math.PI * v); bm[j] = Math.cos(m * Math.PI * v); }
    cuN.push(an); cuM.push(am); rvN.push(bn); rvM.push(bm);
  }
  const warmHue = lerp(44, 8, warmth);                // ambra -> rosso col calore
  const coolHue = lerp(192, 224, warmth);             // ciano -> indaco col freddo
  const gain = 1.4 + act * 0.9;
  cymBuf.loadPixels();
  const px = cymBuf.pixels;
  for(let j = 0; j < CYM_H; j++){
    for(let i = 0; i < CYM_W; i++){
      let S = 0;
      for(let b = 0; b < 5; b++) S += A[b] * (cuN[b][i] * rvM[b][j] - cuM[b][i] * rvN[b][j]) * tph[b];
      const a = Math.min(1, Math.abs(S * 0.5) * gain);
      let r, gr, bl;
      if(a < 0.045){ r = 234; gr = 226; bl = 200; }   // linea nodale = "sabbia" pallida
      else {
        const warm = S >= 0;
        const hue = warm ? warmHue : coolHue;          // mappa divergente caldo/freddo
        const emph = warm ? (0.8 + 0.32 * warmth) : (0.8 + 0.32 * (1 - warmth));
        const bri = Math.min(100, (16 + 80 * Math.pow(a, 0.8)) * emph);
        [r, gr, bl] = hsb2rgb(hue, 72 + 26 * a, bri);
      }
      const idx = (j * CYM_W + i) * 4;
      px[idx] = r; px[idx + 1] = gr; px[idx + 2] = bl; px[idx + 3] = 255;
    }
  }
  cymBuf.updatePixels();
  g.image(cymBuf, 0, 0, ART_W, ART_H);                // upscale 8x sul buffer di stampa
  zoff += lerp(0.01, 0.05, act);
}

// ---- costellazione neurale: il cervello come rete -------------------------
// Nodi (neuroni) seedati dalla firma, collegati ai vicini; impulsi che corrono
// lungo le sinapsi accendendole. alpha->glow/respiro, beta->tasso di scariche
// e propagazione a catena, activation->velocità/energia, gamma->sfarfallio.
let neuralNodes = [], neuralEdges = [], neuralPulses = [];

function initNeural(){
  const rng = mulberry32((seed >>> 0) || 1);
  const N = 90 + Math.floor(rng() * 60);              // 90..150 neuroni
  neuralNodes = [];
  for(let i = 0; i < N; i++){
    neuralNodes.push({
      x: 70 + rng() * (ART_W - 140), y: 70 + rng() * (ART_H - 140),
      r: 4 + rng() * 9, phase: rng() * TWO_PI, hueJ: rng() * 40 - 20, lvl: 0
    });
  }
  neuralEdges = [];
  const k = 3;                                         // ~3 vicini più prossimi
  for(let i = 0; i < N; i++){
    const d = [];
    for(let j = 0; j < N; j++) if(j !== i){
      const dx = neuralNodes[i].x - neuralNodes[j].x, dy = neuralNodes[i].y - neuralNodes[j].y;
      d.push([dx * dx + dy * dy, j]);
    }
    d.sort((a, b) => a[0] - b[0]);
    for(let m = 0; m < k && m < d.length; m++){
      const j = d[m][1], a = Math.min(i, j), b = Math.max(i, j);
      if(!neuralEdges.some(e => e.a === a && e.b === b)) neuralEdges.push({ a, b });
    }
  }
  neuralPulses = [];
  clearArt();
}

function stepNeural(g, bg){
  if(!neuralNodes.length) initNeural();
  const act = activation, t = zoff, baseHue = moodHue();
  g.noStroke();
  g.fill(bg[0], bg[1], Math.max(3, bg[2]), 26);        // velo scuro -> scie
  g.rect(0, 0, ART_W, ART_H);

  // sinapsi (si accendono se un nodo collegato è attivo)
  g.strokeWeight(1.2);
  for(const e of neuralEdges){
    const a = neuralNodes[e.a], b = neuralNodes[e.b];
    const lv = Math.max(a.lvl, b.lvl);
    g.stroke(baseHue, 28, 40 + 50 * lv, 9 + 38 * lv);
    g.line(a.x, a.y, b.x, b.y);
  }

  // scariche: tasso ~ beta * activation
  let toSpawn = powers.beta * (0.4 + act) * 2.4;
  while(toSpawn > 0 && neuralEdges.length){
    if(Math.random() < toSpawn){
      const e = neuralEdges[Math.floor(Math.random() * neuralEdges.length)];
      neuralPulses.push({ e, p: 0, dir: Math.random() < 0.5 ? 1 : -1, spd: 0.012 + act * 0.045 });
    }
    toSpawn -= 1;
  }
  const keep = [];
  for(const pu of neuralPulses){
    pu.p += pu.spd;
    const a = neuralNodes[pu.e.a], b = neuralNodes[pu.e.b];
    const f = pu.dir > 0 ? pu.p : 1 - pu.p;
    const x = lerp(a.x, b.x, f), y = lerp(a.y, b.y, f);
    g.noStroke();
    g.fill((baseHue + 30) % 360, 60, 100, 80); g.circle(x, y, 9);  // alone impulso
    g.fill(42, 18, 100, 95);                   g.circle(x, y, 4);  // nucleo caldo-bianco
    if(pu.p >= 1){
      const dest = pu.dir > 0 ? pu.e.b : pu.e.a;
      neuralNodes[dest].lvl = 1;                                    // accende il neurone
      if(Math.random() < powers.beta * 1.6){                       // propagazione a catena
        const out = neuralEdges.filter(ed => ed.a === dest || ed.b === dest);
        if(out.length){ const ne = out[Math.floor(Math.random() * out.length)]; neuralPulses.push({ e: ne, p: 0, dir: ne.a === dest ? 1 : -1, spd: pu.spd }); }
      }
    } else keep.push(pu);
  }
  neuralPulses = keep.length > 600 ? keep.slice(keep.length - 600) : keep;

  // neuroni
  for(const nd of neuralNodes){
    const breathe = 0.5 + 0.5 * Math.sin(t * 1.5 + nd.phase);
    const flick = 1 + 0.4 * Math.sin(t * 9 + nd.phase) * Math.min(1, powers.gamma * 5);
    const glowA = 8 + powers.alpha * 42 + nd.lvl * 50;
    const hue = (baseHue + nd.hueJ + 360) % 360;
    g.noStroke();
    g.fill(hue, 70, 100, glowA);              g.circle(nd.x, nd.y, nd.r * 4 * flick);              // alone
    g.fill(hue, 55, 100, 70 + 30 * nd.lvl);   g.circle(nd.x, nd.y, nd.r * (1.2 + 0.5 * breathe) * flick); // corpo
    nd.lvl *= 0.92;                                                 // decadimento accensione
  }
  zoff += lerp(0.01, 0.05, act);
}

// ---- mosaico/vetrata (Voronoi): tessuto di tessere colorate ---------------
// Lo spazio è diviso in celle attorno a siti seedati dalla firma, che derivano
// lentamente. Ogni tessera rappresenta una banda EEG: tinta dalla banda,
// luminosità dalla sua potenza LIVE (banda dominante -> tessere accese). I
// bordi (cambio di proprietario) sono scuri = piombatura da vetrata.
const VOR_W = 192, VOR_H = 108;
const VOR_BANDHUE = [222, 168, 40, 6, 300];           // delta,theta,alpha,beta,gamma
const VOR_WARMBAND = [false, false, true, true, true];
let vorBuf = null, vorSites = [], vorOwner = null;

function initVoronoi(){
  if(!vorBuf){ vorBuf = createGraphics(VOR_W, VOR_H); vorBuf.pixelDensity(1); }
  if(!vorOwner) vorOwner = new Int16Array(VOR_W * VOR_H);
  const rng = mulberry32((seed >>> 0) || 1);
  const M = 38 + Math.floor(rng() * 28);              // 38..66 tessere
  vorSites = [];
  for(let i = 0; i < M; i++){
    const ang = rng() * TWO_PI, sp = 0.15 + rng() * 0.5;
    vorSites.push({ x: rng() * VOR_W, y: rng() * VOR_H,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      band: Math.floor(rng() * 5), hueJ: rng() * 16 - 8, phase: rng() * TWO_PI });
  }
  clearArt();
}

function stepVoronoi(g, bg){
  if(!vorBuf || !vorSites.length) initVoronoi();
  const act = activation, t = zoff, M = vorSites.length, drift = 0.2 + act * 1.1;
  for(const s of vorSites){                            // deriva lenta + rimbalzo ai bordi
    s.x += s.vx * drift; s.y += s.vy * drift;
    if(s.x < 0){ s.x = 0; s.vx *= -1; } else if(s.x > VOR_W){ s.x = VOR_W; s.vx *= -1; }
    if(s.y < 0){ s.y = 0; s.vy *= -1; } else if(s.y > VOR_H){ s.y = VOR_H; s.vy *= -1; }
  }
  const A = [powers.delta, powers.theta, powers.alpha, powers.beta, powers.gamma];
  const cols = vorSites.map(s => {                     // colore tessera: banda + potenza live
    const breathe = 0.85 + 0.15 * Math.sin(t * 1.3 + s.phase) * Math.min(1, powers.alpha * 3);
    const pw = A[s.band];
    const emph = VOR_WARMBAND[s.band] ? (0.72 + 0.5 * warmth) : (0.72 + 0.5 * (1 - warmth));
    const sat = 55 + 40 * Math.min(1, pw * 3);
    const bri = Math.min(100, (30 + 62 * Math.min(1, pw * 3.2)) * breathe * emph);
    return hsb2rgb((VOR_BANDHUE[s.band] + s.hueJ + 360) % 360, sat, bri);
  });
  const owner = vorOwner;                              // nearest-site su griglia ridotta
  for(let j = 0; j < VOR_H; j++) for(let i = 0; i < VOR_W; i++){
    let best = 0, bd = 1e9;
    for(let m = 0; m < M; m++){ const dx = i - vorSites[m].x, dy = j - vorSites[m].y; const d = dx*dx + dy*dy; if(d < bd){ bd = d; best = m; } }
    owner[j * VOR_W + i] = best;
  }
  vorBuf.loadPixels();
  const px = vorBuf.pixels;
  for(let j = 0; j < VOR_H; j++) for(let i = 0; i < VOR_W; i++){
    const o = owner[j * VOR_W + i];
    const border = (i + 1 < VOR_W && owner[j * VOR_W + i + 1] !== o) || (j + 1 < VOR_H && owner[(j + 1) * VOR_W + i] !== o);
    const idx = (j * VOR_W + i) * 4;
    if(border){ px[idx] = 14; px[idx + 1] = 12; px[idx + 2] = 20; }   // piombatura scura
    else { const c = cols[o]; px[idx] = c[0]; px[idx + 1] = c[1]; px[idx + 2] = c[2]; }
    px[idx + 3] = 255;
  }
  vorBuf.updatePixels();
  g.image(vorBuf, 0, 0, ART_W, ART_H);                 // upscale 10x sul buffer di stampa
  zoff += lerp(0.004, 0.02, act);
}

// ---- mandala / caleidoscopio: simmetria radiale dalla firma ---------------
// Ordine di simmetria K e motivo seedati dalla firma. Un settore disegnato e
// replicato per rotazione + riflessione (diedrale). Elementi colorati per
// banda: la potenza LIVE ne regola visibilità/dimensione. alpha->respiro,
// beta->rotazione e raggi, theta->archi, activation->velocità.
const MAND_HUE = [222, 168, 40, 6, 300];              // delta,theta,alpha,beta,gamma
let mandala = { K: 8, els: [] };

function initMandala(){
  const rng = mulberry32((seed >>> 0) || 1);
  const K = 6 + Math.floor(rng() * 11);               // ordine simmetria 6..16
  const wedge = TWO_PI / K;
  const nrings = 4 + Math.floor(rng() * 5);           // 4..8 anelli di motivi
  const types = ['circle', 'petal', 'arc', 'ray', 'dot'];
  const els = [];
  for(let ring = 0; ring < nrings; ring++){
    const rad = 0.12 + ring * (0.82 / nrings) + rng() * 0.04;
    const count = 1 + Math.floor(rng() * 3);
    for(let c = 0; c < count; c++){
      els.push({
        rad, ang: rng() * wedge * 0.5,
        type: types[Math.floor(rng() * types.length)],
        size: 0.02 + rng() * 0.06, band: Math.floor(rng() * 5), mir: rng() < 0.7
      });
    }
  }
  mandala = { K, els };
  clearArt();
}

function drawMandalaEl(g, el, maxR, breath, t, A, sign){
  const ang = el.ang * sign;
  const r = el.rad * maxR * breath;
  const x = r * Math.cos(ang), y = r * Math.sin(ang);
  const pw = A[el.band];
  const vis = 0.3 + 0.7 * Math.min(1, pw * 3.2);       // banda dominante -> più visibile
  const hue = MAND_HUE[el.band];
  const sat = 70 + 26 * Math.min(1, pw * 3);
  const bri = 60 + 40 * vis, aA = 35 + 60 * vis;
  const sz = el.size * maxR * (0.6 + 0.8 * vis) * breath;
  g.push();
  g.translate(x, y);
  g.rotate(ang + Math.PI / 2);                          // orienta radialmente
  if(el.type === 'circle'){ g.noStroke(); g.fill(hue, sat, bri, aA); g.circle(0, 0, sz * 2); }
  else if(el.type === 'dot'){ g.noStroke(); g.fill(hue, sat, 100, aA); g.circle(0, 0, sz); }
  else if(el.type === 'petal'){ g.noStroke(); g.fill(hue, sat, bri, aA); g.ellipse(0, 0, sz * 0.8, sz * 2.2); }
  else if(el.type === 'ray'){                           // beta -> raggi lunghi
    const len = sz * (1.5 + powers.beta * 4);
    g.noStroke(); g.rectMode(CENTER); g.fill(hue, sat, bri, aA);
    g.rect(0, 0, Math.max(2, sz * 0.25), len, sz * 0.1);
  } else {                                              // arc
    g.noFill(); g.stroke(hue, sat, bri, aA); g.strokeWeight(Math.max(2, sz * 0.3));
    g.arc(0, 0, sz * 2, sz * 2, 0, Math.PI * (0.6 + 0.4 * Math.sin(t + el.rad * 10)));
  }
  g.pop();
}

function stepMandala(g, bg){
  if(!mandala.els.length) initMandala();
  const act = activation, t = zoff, K = mandala.K;
  const A = [powers.delta, powers.theta, powers.alpha, powers.beta, powers.gamma];
  const maxR = Math.min(ART_W, ART_H) * 0.46;
  g.push();
  g.noStroke(); g.fill(bg[0], bg[1], Math.max(4, bg[2]), 100); g.rect(0, 0, ART_W, ART_H); // fondo pulito
  g.translate(ART_W / 2, ART_H / 2);
  g.rotate(t * (0.04 + powers.beta * 0.5 + act * 0.1));  // rotazione (beta/activation)
  const breath = 1 + (0.05 + 0.08 * Math.min(1, powers.alpha * 3)) * Math.sin(t * 1.1); // respiro (alpha)
  const wedge = TWO_PI / K;
  for(let k = 0; k < K; k++){
    g.push();
    g.rotate(k * wedge);
    for(const el of mandala.els){
      drawMandalaEl(g, el, maxR, breath, t, A, 1);
      if(el.mir) drawMandalaEl(g, el, maxR, breath, t, A, -1);  // riflessione -> diedrale
    }
    g.pop();
  }
  g.pop();
  zoff += lerp(0.006, 0.03, act);
}

// ---- schermo di attesa (finche' non arriva la firma) ----------------------
function drawWaiting(){
  const cx = width / 2, cy = height / 2;
  const p = 0.5 + 0.5 * Math.sin(frameCount * 0.025);
  noFill();
  for(let i = 0; i < 6; i++){
    stroke(208, 38, 82, Math.max(0, 12 - i * 1.7));
    strokeWeight(2);
    const r = 70 + i * 46 + p * 22;
    circle(cx, cy, r * 2);
  }
  for(let k = 0; k < 5; k++){
    const a = frameCount * 0.01 + k * TWO_PI / 5;
    const r = 150 + 30 * Math.sin(frameCount * 0.02 + k);
    noStroke();
    fill(40 + k * 20, 55, 100, 38);
    circle(cx + r * Math.cos(a), cy + r * Math.sin(a), 6 + 3 * p);
  }
  noStroke();
  fill(200, 30, 100, 25 + p * 30);
  circle(cx, cy, 30 + p * 12);
}

// ---- WebSocket con riconnessione automatica -------------------------------
function connectWS(){
  const url = new URLSearchParams(location.search).get("ws") || "ws://127.0.0.1:8765";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", role: "visual" }));
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if(m.type === "features") handleFeatures(m);
    else if(m.cmd === "export") exportArtwork();
    else if(m.cmd === "freeze") frozen = !!m.value;
    else if(m.cmd === "clear") clearArt();
    else if(m.cmd === "anim_mode"){ animMode = m.value || 'flowfield'; initForMode(); }
    else if(m.cmd === "new_session"){ hasSignature = false; seed = null; clearArt(); }
  };
  ws.onclose = () => setTimeout(connectWS, 1500);
  ws.onerror = () => { try { ws.close(); } catch {} };
}

function handleFeatures(m){
  if(m.powers) powers = m.powers;
  if(m.warmth != null) warmth = m.warmth;
  if(m.activation != null) activation = m.activation;
  frozen = !!m.frozen;
  if(m.signature && m.signature.seed != null){
    if(!hasSignature || seed !== (m.signature.seed >>> 0)) applySignature(m.signature.seed);
  } else if(!m.signature && hasSignature){
    hasSignature = false; seed = null; clearArt();
  }
}

// ---- export hi-res on demand: il buffer E' gia' a risoluzione di stampa ----
function exportArtwork(){
  try {
    const dataURL = artBuf.canvas.toDataURL("image/png");
    ws.send(JSON.stringify({ type: "artwork_png", data: dataURL, w: ART_W, h: ART_H }));
  } catch(err){
    console.error("export fallito:", err);
  }
}
