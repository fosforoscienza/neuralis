<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuralis</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden;cursor:none}
  canvas{display:block}
</style>
<!-- p5.js servito in locale: l'installazione deve funzionare anche offline. -->
<script src="libs/p5.min.js"></script>
</head>
<body>
<script>
"use strict";
// ---- canvas di stampa (tutta l'opera vive qui, alla risoluzione finale) ----
const ART_W = 1772, ART_H = 1181;     // 10x15 cm orizzontale @300 DPI
const BG = [228, 45, 4];              // fondo scuro (#05060a) in HSB

let artBuf, ws;
let warmth = 0.5, activation = 0.4, frozen = false;
let hasSignature = false, seed = null, arms = 5, phase = 0, hueBase = 0;
let t = 0;

// PRNG deterministico: stessa firma -> stessa struttura di base, per persona.
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function applySignature(s){
  seed = s >>> 0;
  const rng = mulberry32(seed);
  arms = 3 + Math.floor(rng() * 6);     // 3..8 bracci
  phase = rng() * TWO_PI;               // fase iniziale
  hueBase = rng() * 360;                // variazione cromatica di base
  hasSignature = true;
}

function clearArt(){
  artBuf.push();
  artBuf.noStroke();
  artBuf.fill(BG[0], BG[1], BG[2], 100);
  artBuf.rect(0, 0, ART_W, ART_H);
  artBuf.pop();
}

function setup(){
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  artBuf = createGraphics(ART_W, ART_H);
  artBuf.colorMode(HSB, 360, 100, 100, 100);
  artBuf.pixelDensity(1);              // buffer esattamente 1772x1181 px
  clearArt();
  noCursor();
  connectWS();
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); }

function draw(){
  background(BG[0], BG[1], BG[2]);
  if(!hasSignature){ drawWaiting(); return; }
  if(!frozen) step(artBuf);
  // blit "contain": l'opera (1.5:1) centrata sulla TV, bordi col fondo.
  const s = Math.min(width / ART_W, height / ART_H);
  const w = ART_W * s, h = ART_H * s;
  image(artBuf, (width - w) / 2, (height - h) / 2, w, h);
}

// ---- passo generativo: bracci a spirale che fluiscono ---------------------
function step(g){
  // Persistenza: velo scuro leggero invece di azzerare -> l'opera si accumula.
  g.noStroke();
  g.fill(BG[0], BG[1], BG[2], 3.5);
  g.rect(0, 0, ART_W, ART_H);

  const cx = ART_W / 2, cy = ART_H / 2;
  const maxR = Math.min(ART_W, ART_H) * 0.46, innerR = 34;

  // Colore: warmth 1 -> ambra (35°, caldo), 0 -> ciano (210°, freddo).
  const hue = 35 + (1 - warmth) * 175;
  const act = activation;

  // Forma: activation basso -> linee distese/morbide; alto -> serrate/curve.
  const turns    = lerp(1.1, 2.4, act);   // giri di spirale (piu' stretti se attivo)
  const serrFreq = lerp(2.5, 20, act);    // frequenza di serratura
  const serrAmp  = lerp(3, 14, act);      // ampiezza di serratura
  const wander   = lerp(7, 26, act);      // disturbo organico (flow)
  const rot      = lerp(0.0016, 0.009, act); // velocita' di rotazione
  const sw       = lerp(3.0, 1.6, act);   // spessore tratto

  g.strokeWeight(sw);
  g.noFill();
  const SEG = 220;
  for(let a = 0; a < arms; a++){
    const armAng = phase + a * TWO_PI / arms + t;
    const hh = (((hue + (a - (arms - 1) / 2) * 7 + hueBase * 0.05) % 360) + 360) % 360;
    g.stroke(hh, 78, 96, 30);
    g.beginShape();
    for(let i = 0; i <= SEG; i++){
      const fr = i / SEG;
      let r = innerR + fr * (maxR - innerR);
      const ang = armAng + fr * turns * TWO_PI;
      r += Math.sin(fr * serrFreq * TWO_PI + t * 2.0 + a) * serrAmp;
      r += (noise(a * 12.3 + fr * 3.0, t * 0.25) - 0.5) * 2 * wander;
      g.curveVertex(cx + r * Math.cos(ang), cy + r * Math.sin(ang));
    }
    g.endShape();
  }

  // Nucleo luminoso tenue, tinta sul colore corrente.
  g.noStroke();
  g.fill(hue, 55, 100, 6);
  g.circle(cx, cy, 120);

  t += rot;
}

// ---- schermo di attesa (finche' non arriva la firma) ----------------------
function drawWaiting(){
  const cx = width / 2, cy = height / 2;
  const p = 0.5 + 0.5 * Math.sin(frameCount * 0.025);
  noFill();
  for(let i = 0; i < 6; i++){
    stroke(208, 38, 82, Math.max(0, 12 - i * 1.7));
    strokeWeight(2);
    const r = 70 + i * 46 + p * 22;
    circle(cx, cy, r * 2);
  }
  for(let k = 0; k < 5; k++){
    const a = frameCount * 0.01 + k * TWO_PI / 5;
    const r = 150 + 30 * Math.sin(frameCount * 0.02 + k);
    noStroke();
    fill(40 + k * 20, 55, 100, 38);
    circle(cx + r * Math.cos(a), cy + r * Math.sin(a), 6 + 3 * p);
  }
  noStroke();
  fill(200, 30, 100, 25 + p * 30);
  circle(cx, cy, 30 + p * 12);
}

// ---- WebSocket con riconnessione automatica -------------------------------
function connectWS(){
  const url = new URLSearchParams(location.search).get("ws") || "ws://127.0.0.1:8765";
  ws = new WebSocket(url);
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", role: "visual" }));
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if(m.type === "features") handleFeatures(m);
    else if(m.cmd === "export") exportArtwork();
    else if(m.cmd === "freeze") frozen = !!m.value;
    else if(m.cmd === "clear") clearArt();
    else if(m.cmd === "new_session"){ hasSignature = false; seed = null; clearArt(); }
  };
  ws.onclose = () => setTimeout(connectWS, 1500);
  ws.onerror = () => { try { ws.close(); } catch {} };
}

function handleFeatures(m){
  if(m.warmth != null) warmth = m.warmth;
  if(m.activation != null) activation = m.activation;
  frozen = !!m.frozen;
  if(m.signature && m.signature.seed != null){
    if(!hasSignature || seed !== (m.signature.seed >>> 0)) applySignature(m.signature.seed);
  } else if(!m.signature && hasSignature){
    hasSignature = false; seed = null; clearArt();
  }
}

// ---- export hi-res on demand: il buffer E' gia' a risoluzione di stampa ----
function exportArtwork(){
  try {
    const dataURL = artBuf.canvas.toDataURL("image/png");
    ws.send(JSON.stringify({ type: "artwork_png", data: dataURL, w: ART_W, h: ART_H }));
  } catch(err){
    console.error("export fallito:", err);
  }
}
</script>
</body>
</html>
